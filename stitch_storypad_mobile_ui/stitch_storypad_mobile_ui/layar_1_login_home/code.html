<script>

      tab.className = 'nav-tab relative flex items-center justify-center gap-2 h-10 px-4 rounded-full bg-[#3B82F6] text-[#FFFFFF] transition-all duration-200';

  if (emailBtn) {
    emailBtn.addEventListener('click', () => {
      emailBtn.classList.add('scale-95');
      setTimeout(() => emailBtn.classList.remove('scale-95'), 150);
    });
